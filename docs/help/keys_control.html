<h1>Control keys</h1>
<!-- H2H!show -->

<p>
These are the keys to remember:
</p>
<table class="keys">
	<tr><td><kbd>ctrl-C</kbd> or <kbd>ctrl-G</kbd></td><td>cancel the current function, exit the current panel</td></tr>
	<tr><td><kbd>alt-M</kbd></td><td>invoke main menu (in the file panel only)</td></tr>
	<tr><td><kbd>ctrl-L</kbd></td><td>redraw screen</td></tr>
	<tr><td><kbd>&lt;F1&gt;</kbd></td><td>on-line help</td></tr>
	<tr><td><kbd>alt-Q</kbd></td><td>quit</td></tr>
</table>

</body>
