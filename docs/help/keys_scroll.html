<h1>Panel-scrolling keys</h1>
<!-- H2H!show -->

<p>
These keystrokes scroll a panel:
</p>
<table class="keys">
	<tr><td><kbd>&lt;up&gt;</kbd></td><td>line up</td></tr>
	<tr><td><kbd>&lt;down&gt;</kbd></td><td>line down</td></tr>
	<tr><td><kbd>&lt;page-up&gt;</kbd></td><td>page up</td></tr>
	<tr><td><kbd>&lt;page-down&gt;</kbd></td><td>page down</td></tr>
	<tr><td><kbd>&lt;esc&gt;&nbsp;&lt;home&gt;</kbd></td><td>go to the top of the panel</td></tr>
	<tr><td><kbd>&lt;esc&gt;&nbsp;&lt;end&gt;</kbd></td><td>go to the bottom of the panel</td></tr>
	<tr><td><kbd>alt-Z</kbd></td><td>scroll the current line to the center of the panel</td></tr>
</table>

</body>
</html>
