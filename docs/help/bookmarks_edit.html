<h1>Bookmark properties</h1>
<!-- H2H!show -->

<p>
Each bookmark has two properties: the directory and an optional name.
Both can be modified if necessary.
</p>

<p>
Bookmarked directories must be absolute directories,
i.e. starting from the root directory <code>/</code>.
</p>
